<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Imagens</title>
<link rel="stylesheet" href="imagens.css">
</head>

<body>

<div class="overlay"></div>

<header class="navbar">
    <h1 class="logo">VAMPIRE SLASHER</h1>
    <nav>
        <a href="play.html">Play</a>
        <a href="sobre.html">Sobre</a>
        <a href="imagens.html">Imagens</a>
        <a href="feedback.html">Feedback</a>
        <br>
        <button class="btn-dark" onclick="setTheme('dark')">Escuro</button>
        <button class="btn-dark" onclick="setTheme('light')">Claro</button>
    </nav>
</header>

<main class="main-card">
    <h2>IMAGENS</h2>
    <div class="divider"></div>

    <div class="gallery">
    <img src="imagens/1.png" alt="Imagem 1">
    <img src="imagens/2.png" alt="Imagem 2">
    <img src="imagens/3.png" alt="Imagem 3">
</div>
</main>

<script>
if (localStorage.getItem('tema') === 'light') {
    document.body.classList.add('light');
}

function setTheme(mode) {
    if (mode === 'light') {
        document.body.classList.add('light');
        localStorage.setItem('tema', 'light');
    } else {
        document.body.classList.remove('light');
        localStorage.setItem('tema', 'dark');
    }
}

</script>

</body>
</html>
