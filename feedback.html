<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Feedback</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="overlay"></div>

<header class="navbar">
    <h1 class="logo">VAMPIRE SLASHER</h1>
    <nav>
        <a href="index.html">Home</a>
        <a href="sobre.html">Sobre</a>
        <a href="imagens.html">Imagens</a>
        <a href="feedback.html">Feedback</a>
    </nav>
</header>

<main class="main-card large">
    <h2>FEEDBACK</h2>
    <div class="divider"></div>

    <form onsubmit="enviarFeedback(event)">
        <input type="text" placeholder="Seu nome" required>
        <textarea placeholder="Seu feedback..." required></textarea>

        <div class="stars">
            <span onclick="setRating(1)">★</span>
            <span onclick="setRating(2)">★</span>
            <span onclick="setRating(3)">★</span>
            <span onclick="setRating(4)">★</span>
            <span onclick="setRating(5)">★</span>
        </div>

        <button class="btn">Enviar</button>
    </form>

    <p id="msg"></p>
</main>

<script>
function setRating(value){
    let stars = document.querySelectorAll(".stars span");
    stars.forEach((s,i)=>{
        s.style.color = i < value ? "#e94560" : "#555";
    });
}

function enviarFeedback(e){
    e.preventDefault();
    document.getElementById("msg").innerText = "Obrigado pelo feedback!";
}
</script>

</body>
</html>
